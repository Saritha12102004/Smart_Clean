<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Clean | Signup</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(
          rgba(0, 0, 0, 0.6),
          rgba(0, 0, 0, 0.6)
        ),
        url("https://images.unsplash.com/photo-1501004318641-b39e6451bec6");
      background-size: cover;
      background-position: center;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .form-box {
      background: white;
      padding: 40px;
      width: 380px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .input-box {
      margin-bottom: 25px;
    }

    .input-box input {
      width: 100%;
      padding: 10px;
      border: none;
      border-bottom: 2px solid #ccc;
      outline: none;
      font-size: 16px;
    }

    .age-box {
      margin-bottom: 20px;
      font-size: 14px;
    }

    .age-box span {
      color: #27ae60;
      font-weight: bold;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #2ecc71;
      border: none;
      color: white;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: #27ae60;
    }
  </style>
</head>
<body>

  <div class="form-box">
    <h1>🌱 Smart Clean</h1>
    <p>Create your eco-hero account</p>

    <form id="registerForm">
      
      <div class="input-box">
        <input type="text" id="name" placeholder="Username" required>
      </div>

      <div class="input-box">
        <input type="email" id="email" placeholder="Email" required>
      </div>

      <div class="input-box">
        <input type="password" id="password" placeholder="Password" required>
      </div>

      <div class="input-box">
        <input type="date" id="dob" required>
      </div>

      <div class="age-box">
        Your Age: <span id="age">0</span> years
      </div>

      <button type="submit">Sign Up</button>
    </form>
  </div>

<script>
  const dobInput = document.getElementById("dob");
  const ageSpan = document.getElementById("age");
  const form = document.getElementById("registerForm");

  let calculatedAge = 0;

  // ✅ Age calculation
  dobInput.addEventListener("change", function () {
    const dob = new Date(this.value);
    const today = new Date();

    calculatedAge = today.getFullYear() - dob.getFullYear();

    const monthDiff = today.getMonth() - dob.getMonth();
    if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < dob.getDate())) {
      calculatedAge--;
    }

    ageSpan.textContent = calculatedAge;
  });

  // ✅ REGISTER API CALL (IMPORTANT)
  form.addEventListener("submit", async function (e) {
    e.preventDefault();

    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    if (calculatedAge <= 0) {
      alert("Please select a valid DOB");
      return;
    }

    try {
      const res = await fetch("http://localhost:5000/api/register", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          name,
          email,
          password,
          age: calculatedAge
        })
      });

      const data = await res.json();

      if (res.ok) {
        alert("✅ Registration Successful!");
        window.location.href = "login.html";
      } else {
        alert("❌ " + data.message);
      }

    } catch (error) {
      console.error(error);
      alert("❌ Server not reachable");
    }
  });
</script>

</body>
</html>
